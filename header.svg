<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title description">
  <title id="title">LLM Council</title>
  <desc id="description">Independent model answers are reviewed anonymously and synthesized into one final response.</desc>
  <defs>
