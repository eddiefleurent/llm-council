services:
  llm-council:
    image: g0dfather/llm-council:latest
    container_name: llm-council
    restart: unless-stopped
    # Published on loopback only. For LAN access, drop the "127.0.0.1:" prefixes
    # and set LLM_COUNCIL_CORS_ORIGINS in deploy/.env (see deploy/README.md).
    ports:
      - "127.0.0.1:5173:5173"  # Frontend
      - "127.0.0.1:8001:8001"  # Backend API
    volumes:
      - ./data:/app/data  # Mount local data directory
    env_file:
      - deploy/.env
    environment:
      - PYTHONUNBUFFERED=1
